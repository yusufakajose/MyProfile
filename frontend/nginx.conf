map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|slackbot|linkedinbot|discordbot|pinterestbot|whatsapp|telegram|telegrambot|skypeuripreview|vkshare|metainspector|bitlybot|quora|duckduckbot|embedly|outbrain|qwantify|redditbot|bingbot|yandexbot|baiduspider|sogou|ia_archiver|applebot|google.*snippet|google.*structureddatabot) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for all responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Redirect short links to backend (^~ stops regex matching, preventing .png/.svg interception)
    location ^~ /r/ {
        proxy_pass http://backend:8080/r/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-Id $request_id;
    }

    # Cache static assets aggressively
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        # Security headers (must repeat inside location due to add_header inheritance rules)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP for static assets
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Social preview for public profiles: bots get server-rendered meta
    location ~ ^/u/([^/]+)/?$ {
        if ($is_social_bot) {
            rewrite ^/u/([^/]+)/?$ /api/public/meta/$1 last;
        }
        try_files $uri /index.html;
    }

    # Proxy API to backend service in compose
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-Id $request_id;
    }

    # Proxy Swagger UI and OpenAPI docs to backend
    location = /swagger-ui {
        return 301 /swagger-ui/;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-Id $request_id;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-Id $request_id;
    }

    # SPA routing fallback with CSP and nonce injection in HTML
    location / {
        # Security headers (must repeat inside location due to add_header inheritance rules)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP for HTML
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter "CSP_NONCE_PLACEHOLDER" "$request_id";
        try_files $uri /index.html;
    }
}


